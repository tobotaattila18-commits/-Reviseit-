<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>ReviseIt – Quizzes and flashcards</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--text:#161a2b;--muted:#667089;--accent:#5b5bf0;--accent2:#8b5cf6;--accent-t:#fff;--ok:#16a34a;--bad:#e11d48;--line:#e4e7f2;--shadow:0 6px 24px rgba(40,50,120,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0f111a;--card:#191c29;--text:#eef0f8;--muted:#9aa2bb;--accent:#8b8bff;--accent2:#a78bfa;--accent-t:#0f111a;--ok:#4ade80;--bad:#fb7185;--line:#2a2f45;--shadow:0 6px 24px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:28px 18px 56px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.03em;margin:0 0 4px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
h2{font-size:1.2rem;font-weight:700;letter-spacing:-.01em;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin:16px 0 6px}
select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;transition:border-color .2s,box-shadow .2s}
select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 16px;cursor:pointer;background:linear-gradient(90deg,var(--accent),var(--accent2));color:var(--accent-t);width:100%;margin-top:18px;transition:transform .15s,box-shadow .2s,opacity .2s}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 35%,transparent)}
button:active:not(:disabled){transform:scale(.98)}
button.alt{background:var(--card);color:var(--text);border:1.5px solid var(--line)}
button.alt:hover:not(:disabled){box-shadow:var(--shadow)}
button:disabled{opacity:.45;cursor:default}
.opt{display:block;width:100%;text-align:left;margin:10px 0 0;background:var(--bg);color:var(--text);border:1.5px solid var(--line);font-weight:500;padding:13px 14px;transition:transform .15s,border-color .2s,background .2s}
.opt:hover:not(:disabled){transform:translateX(4px);box-shadow:none;border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--bg));transform:translateX(4px)}
.tag{display:inline-block;font-size:.72rem;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:99px;padding:3px 11px;margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:9px;margin-bottom:18px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:9px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.score{font-size:3rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.fc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fc{border:1.5px dashed var(--muted);border-radius:14px;padding:14px;break-inside:avoid;font-size:.92rem;background:var(--bg);animation:up .45s cubic-bezier(.22,1,.36,1) both}
.fc small{color:var(--muted);display:block;margin-bottom:6px}
.fc .back{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;color:var(--muted)}
.hide{display:none!important}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#setup,#summary,#weak,#fcbox,#again,main>div.noprint{animation:up .5s cubic-bezier(.22,1,.36,1) both}
#quiz>*{animation:up .4s cubic-bezier(.22,1,.36,1) both}
#quiz>.opt:nth-of-type(1){animation-delay:.05s}#quiz>.opt:nth-of-type(2){animation-delay:.1s}#quiz>.opt:nth-of-type(3){animation-delay:.15s}#quiz>.opt:nth-of-type(4){animation-delay:.2s}
#review .card{animation:up .45s cubic-bezier(.22,1,.36,1) both}
#review .card:nth-child(3){animation-delay:.08s}#review .card:nth-child(4){animation-delay:.16s}#review .card:nth-child(5){animation-delay:.24s}#review .card:nth-child(n+6){animation-delay:.3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.fc-grid{grid-template-columns:1fr}}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}main>*:not(#printarea){display:none!important}#printarea{display:block!important}.fc{border-color:#000;color:#000;animation:none;background:#fff}.fc small,.fc .back{color:#333}.fc-grid{grid-template-columns:1fr 1fr!important}}

input{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px}
input:focus{outline:0;border-color:var(--accent)}
.prof{display:flex;align-items:center;gap:14px}
.av{font-size:2rem;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 15%,var(--bg));flex:none}
.pi{flex:1;min-width:0}.pi strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar.mini{height:6px;margin:6px 0 0}
.streak{font-weight:700;text-align:center;flex:none}.streak small{display:block;font-weight:500;color:var(--muted);font-size:.7rem}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task div{flex:1}.task small{color:var(--muted);display:block}
.task button{width:auto;margin:0;padding:8px 14px;font-size:.85rem}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.avs button{width:48px;height:48px;margin:0;padding:0;font-size:1.5rem;background:var(--bg);border:2px solid var(--line)}
.avs button.on{border-color:var(--accent)}
details summary{cursor:pointer;font-weight:700}
.xpmsg{margin-top:10px;font-weight:600;color:var(--accent)}
</style>
</head>
<body>
<main>
<div class="noprint"><h1>ReviseIt</h1><p class="sub">Quizzes with instant marking and printable flashcards.</p></div>

<section id="home" class="noprint">
<div class="card prof"><div id="avatar" class="av"></div><div class="pi"><strong id="pname"></strong><div id="plevel" class="sub" style="margin:0;font-size:.85rem"></div><div class="bar mini"><i id="pxp" style="width:0"></i></div><div class="sub" style="margin:4px 0 0;font-size:.72rem">Tap to edit your name and picture</div></div><div id="pstreak" class="streak"></div></div>
<div class="card"><h2>Today’s tasks</h2><div id="tasks"></div></div>
<details id="pdet" class="card"><summary>Profile and reminders</summary>
<label for="uname">Username</label><input id="uname" maxlength="16" placeholder="Pick a nickname"><button id="usave" class="alt">Save username</button>
<label>Profile picture</label><div id="avs" class="avs"></div>
<label for="rtime">Daily reminder time</label><input id="rtime" type="time">
<button id="remind" class="alt">Turn on reminders</button>
<p id="rnote" class="sub" style="margin:10px 0 0;font-size:.82rem"></p>
<p class="sub" style="margin:8px 0 0;font-size:.82rem">Your profile is saved on this device only. Please don’t use your real name or school.</p></details>
</section>

<section id="setup" class="card">
<h2>Make a quiz</h2>
<label for="subj">Subject</label>
<select id="subj"></select>
<label for="lvl">Level</label>
<select id="lvl"><option value="KS3">KS3</option><option value="GCSE" selected>GCSE Foundation</option><option value="H">GCSE Higher</option><option value="A">A-level</option></select>
<label for="n">Number of questions</label>
<select id="n"><option>4</option><option selected>8</option><option>12</option><option>20</option></select>
<p id="info" class="sub" style="margin:14px 0 0;font-size:.85rem"></p>
<button id="go">Start quiz</button>
</section>

<section id="quiz" class="card hide"></section>

<section id="results" class="hide">
<div id="summary" class="card"></div>
<div id="review"></div>
<div id="weak" class="card"></div>
<div id="fcbox" class="card"><h2>Your flashcards</h2><div id="fcgrid" class="fc-grid"></div><button id="print" class="noprint">Print flashcards</button></div>
<button id="again" class="alt noprint">Make another quiz</button>
</section>
<div id="printarea" class="hide"><div id="printgrid" class="fc-grid"></div></div>
</main>

var $=function(i){return document.getElementById(i)};
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){['setup','quiz','results'].forEach(function(x){$(x).classList.toggle('hide',x!==id)});$('home').classList.toggle('hide',id!=='setup');window.scrollTo(0,0)}
var state={};

var subs=Object.keys(Q);
$('subj').innerHTML='<option value="*">All subjects (mixed)</option>'+subs.map(function(s){return '<option>'+s+'</option>'}).join('');

function getPool(){return poolFor($('subj').value,$('lvl').value)}
function poolFor(s,l){var pool=[];(s==='*'?subs:[s]).forEach(function(k){(l==='H'?Q[k].GCSE.concat(Q[k].H):Q[k][l]).forEach(function(q){pool.push({subj:k,topic:q[0],q:q[1],opts:q[2],ans:q[2][q[3]],e:q[4]})})});return pool}
function info(){var c=getPool().length,n=parseInt($('n').value,10);$('info').textContent=c+' questions available'+(c<n?'. Your quiz will have '+c+'.':'.')}
['subj','lvl','n'].forEach(function(i){$(i).onchange=info});info();
function seenGet(){try{return JSON.parse(localStorage.getItem('reviseit_seen')||'{}')}catch(e){return{}}}
function seenSet(o){try{localStorage.setItem('reviseit_seen',JSON.stringify(o))}catch(e){}}
/* Rotation: unseen questions first, then the cycle restarts once they have all been used */
function pick(pool,n){
  var seen=seenGet(),picked=shuf(pool.filter(function(q){return !seen[q.q]})).slice(0,n);
  if(picked.length<n){
    pool.forEach(function(q){delete seen[q.q]});
    picked=picked.concat(shuf(pool.filter(function(q){return picked.indexOf(q)<0})).slice(0,n-picked.length));
  }
  picked.forEach(function(q){seen[q.q]=1});seenSet(seen);return picked;
}
$('go').onclick=function(){
  var l=$('lvl').value,n=parseInt($('n').value,10);
  var qs=pick(getPool(),n).map(function(q){q.opts=shuf(q.opts);return q});
  startQuiz(qs,l,null);
};

function renderQ(){
  var q=state.qs[state.i],t=state.qs.length,h='';
  h+='<div class="bar"><i style="width:'+(state.i/t*100)+'%"></i></div>';
  h+='<span class="tag">Question '+(state.i+1)+' of '+t+' · '+esc(q.subj)+' · '+esc(q.topic)+'</span><h2>'+esc(q.q)+'</h2>';
  q.opts.forEach(function(o,k){h+='<button class="opt" data-k="'+k+'">'+esc(o)+'</button>'});
  h+='<button id="next" disabled>'+(state.i===t-1?'Finish and mark':'Next')+'</button>';
  $('quiz').innerHTML=h;
  setTimeout(function(){var b=document.querySelector('.bar i');if(b)b.style.width=((state.i+1)/t*100)+'%'},40);
  var cur=null,next=$('next');
  Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){
    b.onclick=function(){
      Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(x){x.classList.remove('sel')});
      b.classList.add('sel');cur=q.opts[+b.dataset.k];next.disabled=false;
    };
  });
  next.onclick=function(){state.ans[state.i]=cur;state.i++;if(state.i<t)renderQ();else results()};
}

function results(){
  var score=0,t=state.qs.length,rv='',cards=[],weak={};
  state.qs.forEach(function(q,i){
    var ok=state.ans[i]===q.ans;
    if(ok)score++;else{weak[q.subj+' – '+q.topic]=1;cards.push(q)}
    rv+='<div class="card"><span class="tag">'+esc(q.subj)+' · '+esc(q.topic)+'</span><div><strong>'+esc(q.q)+'</strong></div>'+
    '<p>Your answer: '+esc(state.ans[i])+'</p><p class="'+(ok?'ok':'bad')+'"><strong>'+(ok?'✓ Correct':'✗ Not quite')+'</strong></p>'+
    (ok?'':'<p>Answer: '+esc(q.ans)+'</p>')+'<p class="sub" style="margin:0">'+esc(q.e)+'</p></div>';
  });
  $('summary').innerHTML='<div class="score">'+score+' / '+t+'</div><div>'+esc(({KS3:'KS3',GCSE:'GCSE Foundation',H:'GCSE Higher',A:'A-level'})[state.lvl])+' quiz</div>';
  $('review').innerHTML='<h2 style="margin:6px 0 10px">Question review</h2>'+rv;
  var keys=Object.keys(weak);
  $('weak').innerHTML=keys.length?'<h2>What to revise</h2><ul>'+keys.map(function(k){return '<li>'+esc(k)+'</li>'}).join('')+'</ul>':'<h2>Great work!</h2><p>No weak topics this time. Try the other level or a different subject.</p>';
  $('fcbox').classList.toggle('hide',!cards.length);
  var g=cards.map(function(c){return '<div class="fc"><small>'+esc(c.subj)+' · '+esc(c.topic)+'</small><strong>'+esc(c.q)+'</strong><div class="back">'+esc(c.ans)+'. '+esc(c.e)+'</div></div>'}).join('');
  $('fcgrid').innerHTML=g;$('printgrid').innerHTML=g;
  award(score,t);show('results');
}
$('print').onclick=function(){$('printarea').classList.remove('hide');window.print();setTimeout(function(){$('printarea').classList.add('hide')},500)};
$('again').onclick=function(){show('setup')};

/* ---------- Profile, XP, streaks, tasks, reminders (saved in this browser only) ---------- */
var AVS=['🦊','🐼','🐯','🦉','🐙','🦄','🚀','⚡','🎮','📚','🌟','🐉','🐱','🐶','🐸','🦁','🐧','🦋','🍕','⚽','🎸','🌈','🔥','🤖'];
function startQuiz(qs,l,task){state={qs:qs.map(function(q){q.opts=shuf(q.opts);return q}),ans:[],i:0,lvl:l,task:task};renderQ();show('quiz')}
function P(){try{var p=JSON.parse(localStorage.getItem('reviseit_profile')||'{}');return Object.assign({name:'',avatar:'🦊',xp:0,streak:0,best:0,last:'',tasks:{},remind:'',pinged:''},p)}catch(e){return {name:'',avatar:'🦊',xp:0,streak:0,best:0,last:'',tasks:{},remind:'',pinged:''}}}
function saveP(p){try{localStorage.setItem('reviseit_profile',JSON.stringify(p))}catch(e){}}
function today(){return new Date().toLocaleDateString('en-CA')}
function lvlOf(xp){return Math.floor(xp/100)+1}
var LVN={KS3:'KS3',GCSE:'GCSE Foundation',H:'GCSE Higher',A:'A-level'};
function dayN(){return Math.floor(Date.now()/864e5)}
function challenge(){var d=dayN();return{s:subs[d%subs.length],l:['KS3','GCSE','H','A'][d%4]}}
function renderHome(){
  var p=P(),t=today(),y=new Date(Date.now()-864e5).toLocaleDateString('en-CA'),done=p.tasks[t]||{};
  $('avatar').textContent=p.avatar;$('pname').textContent=p.name||'Student';
  $('plevel').textContent='Level '+lvlOf(p.xp)+' · '+(p.xp%100)+'/100 XP';
  $('pxp').style.width=(p.xp%100)+'%';
  var live=p.last===t||p.last===y?p.streak:0;
  $('pstreak').innerHTML='🔥 '+live+'<small>'+(p.last===t?'day streak':live?'study today!':'day streak')+'</small>';
  var c=challenge(),T=[
    ['qd','Question of the day','One random question',15],
    ['q3','Quick 3','3 questions from your chosen subject and level',30],
    ['ch','Daily challenge','8 questions: '+c.s+', '+LVN[c.l],60]];
  $('tasks').innerHTML=T.map(function(x){return '<div class="task"><div><strong>'+x[1]+'</strong><small>'+x[2]+' · +'+x[3]+' XP</small></div><button data-t="'+x[0]+'"'+(done[x[0]]?' disabled>Done ✓':'>Start')+'</button></div>'}).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#tasks button'),function(b){b.onclick=function(){runTask(b.dataset.t)}});
  $('uname').value=p.name;$('rtime').value=p.remind;
  $('avs').innerHTML=AVS.map(function(a){return '<button data-a="'+a+'"'+(a===p.avatar?' class="on"':'')+'>'+a+'</button>'}).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#avs button'),function(b){b.onclick=function(){var q=P();q.avatar=b.dataset.a;saveP(q);renderHome()}});
  var ok='Notification' in window;
  $('remind').textContent=ok&&Notification.permission==='granted'&&p.remind?'Reminders on ✓ (tap to update)':'Turn on reminders';
  $('rnote').textContent=ok?'Reminders only appear while this page is open in a tab. Real background notifications need a server.':'Your browser doesn’t support notifications.';
}
function runTask(k){
  var s,l,n,pool,c=challenge();
  if(k==='qd'){s=subs[Math.floor(Math.random()*subs.length)];l=['KS3','GCSE','H','A'][Math.floor(Math.random()*4)];n=1}
  else if(k==='q3'){s=$('subj').value;l=$('lvl').value;n=3}
  else{s=c.s;l=c.l;n=8}
  pool=poolFor(s,l);startQuiz(pick(pool,n),l,k);
}
function award(score,t){
  var p=P(),d=today(),y=new Date(Date.now()-864e5).toLocaleDateString('en-CA'),before=lvlOf(p.xp),gain=score*10,msg='';
  if(p.last!==d){p.streak=p.last===y?p.streak+1:1;p.last=d}
  p.best=Math.max(p.best,p.streak);
  if(state.task){var b={qd:15,q3:30,ch:60}[state.task];p.tasks={};p.tasks[d]=P().tasks[d]||{};if(!p.tasks[d][state.task]){p.tasks[d][state.task]=1;gain+=b;msg=' (includes +'+b+' task bonus)'}}
  p.xp+=gain;saveP(p);
  var up=lvlOf(p.xp)>before;
  $('summary').innerHTML+='<div class="xpmsg">+'+gain+' XP'+msg+' · 🔥 '+p.streak+' day streak'+(up?' · 🎉 Level up! You’re level '+lvlOf(p.xp):'')+'</div>';
  renderHome();
}
function saveName(){var p=P();p.name=$('uname').value.trim().slice(0,16);saveP(p);renderHome()}
$('uname').oninput=function(){$('pname').textContent=this.value.trim().slice(0,16)||'Student'};
$('uname').onchange=saveName;
$('usave').onclick=function(){saveName();$('usave').textContent='Saved ✓';setTimeout(function(){$('usave').textContent='Save username'},1500)};
document.querySelector('.prof').onclick=function(){$('pdet').open=true;$('pdet').scrollIntoView({behavior:'smooth'})};
document.querySelector('.prof').style.cursor='pointer';
$('remind').onclick=function(){
  var p=P();p.remind=$('rtime').value||'18:00';saveP(p);
  if('Notification' in window&&Notification.permission!=='granted')Notification.requestPermission().then(renderHome);else renderHome();
};
setInterval(function(){
  var p=P();if(!p.remind||!('Notification' in window)||Notification.permission!=='granted')return;
  var n=new Date(),hm=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2);
  if(hm===p.remind&&p.last!==today()&&p.pinged!==today()){p.pinged=today();saveP(p);try{new Notification('ReviseIt',{body:'Time for a quick quiz. Keep your streak going!'})}catch(e){}}
},30000);
renderHome();

</script>
</body>
</html>
